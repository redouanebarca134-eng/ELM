# التكامل المستمر (CI) لمشروع Next.js — تثبيت الحزم، فحص الشيفرة، ثم البناء.
name: CI

on:
  push:
    branches: ["claude/funny-hawking-jqcUh", "main"]
  pull_request:
    branches: ["claude/funny-hawking-jqcUh", "main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
